<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ኦርቶዶክሳዊ መልስ - Orthodox Answer</title>
  
  <!-- React & React-DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-100 min-h-screen text-stone-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [lang, setLang] = useState('am');
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [question, setQuestion] = useState('');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [isMenuOpen, lang]);

      const translations = {
        am: { 
          title: "ኦርቶዶክሳዊ መልስ", 
          quote: "መጠየቅ ያውቃል ያደርጋል", 
          askHere: "እዚህ ይጠይቁ:", 
          placeholder: "የመንፈሳዊ ጥያቄዎን እዚህ ያስገቡ...", 
          button: "መልስ አግኝ", 
          dir: "ltr", 
          menuTitle: "ዋና ማውጫ", 
          menuLinks: ["ስለ እኛ", "የቀደሙ መልሶች", "ሕገ ቤተክርስቲያን", "ግንኙነት"] 
        },
        en: { 
          title: "Orthodox Answer", 
          quote: "Asking makes one learned", 
          askHere: "Ask Here:", 
          placeholder: "Enter your spiritual questions here...", 
          button: "Get Answer", 
          dir: "ltr", 
          menuTitle: "Main Menu", 
          menuLinks: ["About Us", "Previous Answers", "Church Canons", "Contact Us"] 
        },
        ar: { 
          title: "إجابة أورثوذكسية", 
          quote: "المطالبة تجعل المرء عالماً", 
          askHere: "أسأل هنا:", 
          placeholder: "أدخل أسئلتك الروحية هنا...", 
          button: "احصل على الإجابة", 
          dir: "rtl", 
          menuTitle: "القائمة الرئيسية", 
          menuLinks: ["معلومات عنا", "الإجابات السابقة", "قوانين الكنيسة", "اتصل بنا"] 
        },
        om: { 
          title: "Deebii Oortodoksii", 
          quote: "Gaafachuun beekaa nama taasisa", 
          askHere: "Asitti Gaafadhaa:", 
          placeholder: "Gaaffii afuuraa keessan asitti galchaa...", 
          button: "Deebii Argadhu", 
          dir: "ltr", 
          menuTitle: "Baafata Guddaa", 
          menuLinks: ["Waa'ee Keenna", "Deebiiwwan Darban", "Seera Seera Seera", "Nu Quunnamaa"] 
        }
      };

      const languages = [
        { code: 'am', name: 'አማርኛ' },
        { code: 'en', name: 'English' },
        { code: 'ar', name: 'العربية' },
        { code: 'om', name: 'Afaan Oromoo' }
      ];

      const t = translations[lang];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!question.trim()) return;
        alert(`ጥያቄዎ ተልኳል: ${question}`);
        setQuestion('');
      };

      return (
        <div dir={t.dir} className="min-h-screen bg-stone-100 p-4 font-sans">
          {/* HEADER */}
          <header className="max-w-xl mx-auto flex justify-between items-center p-4 bg-white shadow-md rounded-xl">
            <h1 className="text-xl md:text-2xl font-bold text-[#800020]">{t.title}</h1>
            <button 
              onClick={() => setIsMenuOpen(!isMenuOpen)} 
              className="p-2 rounded-lg hover:bg-[#800020]/10 border border-[#D4AF37]/40 transition text-[#800020]"
              aria-label="Toggle Menu"
            >
              <i data-lucide={isMenuOpen ? "x" : "menu"}></i>
            </button>
          </header>

          {/* DROPDOWN MENU */}
          {isMenuOpen && (
            <div className="max-w-xl mx-auto mt-2 p-4 bg-white rounded-xl shadow-lg border border-stone-200">
              <h2 className="font-bold text-stone-700 mb-2 border-b pb-1">{t.menuTitle}</h2>
              <ul className="space-y-2">
                {t.menuLinks.map((link, idx) => (
                  <li key={idx}>
                    <a href="#" className="block p-2 rounded hover:bg-stone-100 text-stone-600 font-medium">
                      {link}
                    </a>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* MAIN CONTENT */}
          <main className="mt-6 max-w-xl mx-auto space-y-6">
            {/* LANGUAGE SELECTOR */}
            <div className="flex flex-wrap gap-2 justify-center">
              {languages.map((item) => (
                <button
                  key={item.code}
                  onClick={() => setLang(item.code)}
                  className={`px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition-all duration-200 border ${
                    lang === item.code
                      ? 'bg-[#800020] text-[#F3E5AB] font-bold border-[#D4AF37] shadow-md scale-105'
                      : 'bg-white text-stone-700 border-stone-300 hover:bg-stone-200'
                  }`}
                >
                  {item.name}
                </button>
              ))}
            </div>

            {/* QUESTION CARD */}
            <div className="bg-white p-6 rounded-xl shadow-lg border border-stone-200">
              <blockquote className="italic text-stone-600 mb-4 border-l-4 border-[#800020] pl-3">
                "{t.quote}"
              </blockquote>

              <form onSubmit={handleSubmit} className="space-y-4">
                <label className="block text-sm font-semibold text-stone-700">
                  {t.askHere}
                </label>
                <textarea
                  value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                  placeholder={t.placeholder}
                  className="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#800020] focus:outline-none transition"
                  rows="4"
                />
                <button
                  type="submit"
                  className="w-full py-2.5 bg-[#800020] text-white font-semibold rounded-lg hover:bg-[#600018] transition shadow-md flex items-center justify-center gap-2"
                >
                  <i data-lucide="send" className="w-4 h-4"></i>
                  {t.button}
                </button>
              </form>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
