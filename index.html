            --text-dark: #2C2C2C;
            --white: #FFFFFF;
            --green: #2e7d32;
            --card-bg: #FFFFFF;
            --input-border: #DDD;
            --answer-bg: #F4F6F9;
        }

        body.dark-mode {
            --bg-light: #121212;
            --text-dark: #E0E0E0;
            --card-bg: #1E1E1E;
            --input-border: #444;
            --answer-bg: #2A2A2A;
            --royal-blue: #64B5F6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Nyala, 'Abyssinica SIL', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background: linear-gradient(135deg, var(--deep-red), #002366);
            color: var(--gold);
            padding: 0.8rem 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 4px solid var(--gold);
            position: relative;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .main-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.1);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background-color: #1A1A1A;
            color: var(--white);
            z-index: 1000;
            transition: 0.3s ease-in-out;
            padding: 2rem 1.5rem;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            border-left: 3px solid var(--gold);
        }

        .sidebar.active {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .sidebar ul {
            list-style: none;
            margin-top: 3rem;
        }

        .sidebar ul li {
            margin: 1.5rem 0;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }

        .sidebar ul li a {
            color: var(--white);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.2s;
        }

        .sidebar ul li a:hover {
            color: var(--gold);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        .lang-container {
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.6rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .lang-btn {
            background-color: transparent;
            border: 1.5px solid var(--green);
            color: var(--green);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn:hover, .lang-btn.active {
            background-color: var(--green);
            color: #FFFFFF;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .hero {
            text-align: center;
            padding: 2.5rem 1rem;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
        }

        .hero h1 {
            font-size: 2.5rem;
            color: var(--deep-red);
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        body.dark-mode .hero h1 {
            color: #ff6b6b;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--royal-blue);
            font-weight: 600;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 90%;
            margin: 0 auto 2rem auto;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 2px solid var(--gold);
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--royal-blue);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 1rem;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            background-color: var(--card-bg);
            color: var(--text-dark);
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        .answer-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: var(--answer-bg);
            border-left: 5px solid var(--royal-blue);
            border-radius: 4px;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .answer-box.active {
            display: block;
        }

        .answer-box h3 {
            color: var(--deep-red);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.dark-mode .answer-box h3 {
            color: #ff6b6b;
        }

        .answer-text {
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-dark);
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--gold);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--deep-red);
        }

            color: var(--royal-blue);
            text-decoration: none;
            font-weight: bold;

            font-size: 0.9rem;

            font-weight: bold;
        }

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

        .rtl {
            direction: rtl;
            text-align: right;

        document.getElementById('menu-close').addEventListener('click', closeModalAndSidebar);
        overlay.addEventListener('click', closeModalAndSidebar);

        function closeModalAndSidebar() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.getElementById('info-modal').style.display = 'none';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            closeModalAndSidebar();
        }

        function changeLang(lang, btnElement) {
            currentLang = lang;
            const t = translations[lang];

            if (lang === 'ar') {
                document.body.classList.add('rtl');
            } else {
                document.body.classList.remove('rtl');
            }

            document.getElementById('header-title').innerText = t.header;
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-sub').innerText = t.heroSub;
            document.getElementById('input-label').innerText = t.inputLabel;
            document.getElementById('user-q').placeholder = t.placeholder;
            document.getElementById('ans-title').innerHTML = `<i class="fa-solid fa-book-bible"></i> ${t.ansTitle}`;
            document.getElementById('m-theme').innerText = t.mTheme;
            document.getElementById('m-about').innerText = t.mAbout;
            document.getElementById('m-share').innerText = t.mShare;
            document.getElementById('m-feedback').innerText = t.mFeedback;
            document.getElementById('m-contact').innerText = t.mContact;
            document.getElementById('footer-copy').innerText = t.footerCopy;

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            autoSearch();
        }

        let searchTimeout;
        function autoSearch() {
            clearTimeout(searchTimeout);
            const q = document.getElementById('user-q').value.trim();
            const ansBox = document.getElementById('answer-box');
            const ansText = document.getElementById('ans-text');

            if (q === "") {
                ansBox.classList.remove('active');
                return;
            }

            searchTimeout = setTimeout(() => {
                const t = translations[currentLang];
                let customResponse = `<strong>"${q}"</strong> <br><br> ${t.defaultAnswer}`;
                ansText.innerHTML = customResponse;
                ansBox.classList.add('active');
            }, 300);
        }

        function openModal(type) {
            closeModalAndSidebar();
            const modal = document.getElementById('info-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const t = translations[currentLang];

            if (type === 'about') {
                title.innerText = t.mAbout;
                body.innerText = "ይህ መድረክ የኢትዮጵያ ኦርቶዶክሳዊ ተዋሕዶ ቤተክርስቲያንን ትምህርት፣ ሥርዓትና ታሪክ ለምእመናን በበርካታ ቋንቋዎች ለማድረስ የተዘጋጀ መንፈሳዊ መተግበሪያ ነው።";
            } else if (type === 'feedback' || type === 'contact') {
                title.innerText = (type === 'feedback') ? t.mFeedback : t.mContact;
                body.innerHTML = `
                    ለማንኛውም አስተያየት ወይም ጥያቄ በእነዚህ አድራሻዎች ያግኙን፡ <br><br>
                    <strong>ኢሜይል:</strong> <a href="mailto:ezrasamuel2721@gmail.com" class="contact-link">ezrasamuel2721@gmail.com</a><br>
                    <strong>ስልክ:</strong> <a href="tel:0962244464" class="contact-link">0962244464</a>
                `;
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('info-modal').style.display = 'none';
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'ኦርቶዶክሳዊ መልስ',
                    text: 'መጠየቅ ያደርጋል ሊቅ - መንፈሳዊ ጥያቄዎችዎን ይጠይቁ',
                    url: window.location.href,
                });
            } else {
                alert("ሊንኩን ኮፒ በማድረግ ያጋሩ፡ " + window.location.href);
            }
        }
    </script>
</body>
