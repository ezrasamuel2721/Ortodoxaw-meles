<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኦርቶዶክሳዊ መልስ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        /* Header Styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cross-icon {
            color: '#c59b27';
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
        }
        .title-area h1 {
            margin: 0;
            color: #c59b27;
            font-size: 22px;
        }
        .title-area p {
            margin: 0;
            color: #8c733e;
            font-size: 13px;
        }
        .menu-btn {
            border: 1px solid #c59b27;
            background: transparent;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            color: #c59b27;
            font-size: 20px;
        }

        /* Language Buttons Styling */
        .lang-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none; /* Firefox */
        }
        .lang-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        .lang-btn {
            border: 1px solid #dcdcdc;
            background-color: #ffffff;
            color: #555;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background-color: #d9a74a;
            color: #ffffff;
            border-color: #d9a74a;
            font-weight: bold;
        }

        /* Card Section */
        .card {
            border: 1px solid #e8dec3;
            border-radius: 16px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .card-title {
            color: #c59b27;
            margin: 0 0 15px 0;
            font-size: 18px;
        }
        .input-box {
            position: relative;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            background-color: #fafafa;
        }
        textarea {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-size: 14px;
            color: #333;
            min-height: 90px;
        }
        .send-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .send-btn {
            background-color: #c59b27;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Response Area */
        .response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #fcf9f2;
            border-left: 4px solid #c59b27;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Section -->
    <div class="header">
        <div class="brand">
            <span class="cross-icon" style="color:#c59b27;">┼</span>
            <div class="title-area">
                <h1 id="main-title">ኦርቶዶክሳዊ መልስ</h1>
                <p id="sub-title">መጠየቅ ያደርጋል ሊቅ</p>
            </div>
        </div>
        <button class="menu-btn">☰</button>
    </div>

    <!-- Language Selector -->
    <div class="lang-container" id="lang-container">
        <!-- Buttons are populated by JS -->
    </div>

    <!-- Main Question Card -->
    <div class="card">
        <h2 class="card-title" id="ask-header">እሁድ ይጠይቁ</h2>
        <div class="input-box">
            <textarea id="question-input" placeholder="መንፈሳዊ ጥያቄዎን እዚህ ያስገቡ... (ጥያቄውን ጽፈው ሲጨርሱ መልሱ ወዲያው ይመጣል)"></textarea>
            <div class="send-btn-container">
                <button class="send-btn" onclick="submitQuestion()">ላክ</button>
            </div>
        </div>
        <div id="response-box" class="response-box"></div>
    </div>
</div>

<script>
    // 1. የቋንቋዎች መረጃና ትርጉም
    const translations = {
        am: {
            name: "አማርኛ",
            title: "ኦርቶዶክሳዊ መልስ",
            subtitle: "መጠየቅ ያደርጋል ሊቅ",
            askHeader: "እዚህ ይጠይቁ",
            placeholder: "መንፈሳዊ ጥያቄዎን እዚህ ያስገቡ... (ጥያቄውን ጽፈው ሲጨርሱ መልሱ ወዲያው ይመጣል)"
        },
        en: {
            name: "English",
            title: "Orthodox Answer",
            subtitle: "Ask and Receive Wisdom",
            askHeader: "Ask Here",
            placeholder: "Enter your spiritual question here..."
        },
        ti: {
            name: "ትግርኛ",
            title: "ኦርቶዶክሳዊ መልሲ",
            subtitle: "ምሕታት ይገብር ሊቅ",
            askHeader: "ኣብዚ ሐቱ",
            placeholder: "መንፈሳዊ ሕቶኹም ኣብዚ የእትዉ..."
        },
        om: {
            name: "Afaan Oromoo",
            title: "Deebii Ortodoksii",
            subtitle: "Gaafachuun Ogeessa Isaan Taasisa",
            askHeader: "Asitti Gaafadhaa",
            placeholder: "Gaaffii afuuraa keessan asitti galchaa..."
        },
        sid: {
            name: "Sidaamu Afoo",
            title: "Ortodoksete Dawaro",
            subtitle: "Oso'leenna Ogessa Ikkano",
            askHeader: "Konninni Osol'le",
            placeholder: "Ayyaanaamete osol'le konninni borreessite..."
        },
        gur: {
            name: "ጉራጊኛ",
            title: "ኦርቶዶክሳዊ ምልስ",
            subtitle: "ጠያቄ የፐርካበታ",
            askHeader: "እካ ጠይቅ",
            placeholder: "መንፈሳዊ ጥያቄኸ እካ አስገባ..."
        }
    };

    let currentLang = 'am';

    // 2. የቋንቋ ቁልፎችን የመፍጠርና የማሳየት ተግባር
    function renderLangButtons() {
        const container = document.getElementById('lang-container');
        container.innerHTML = '';

        Object.keys(translations).forEach(langKey => {
            const btn = document.createElement('button');
            btn.className = `lang-btn ${langKey === currentLang ? 'active' : ''}`;
            btn.innerText = translations[langKey].name;
            btn.onclick = () => switchLanguage(langKey);
            container.appendChild(btn);
        });
    }

    // 3. ቋንቋ ሲቀየር የጽሑፍ ዝርዝሮችን የመቀየር ተግባር
    function switchLanguage(langKey) {
        currentLang = langKey;
        const data = translations[langKey];

        document.getElementById('main-title').innerText = data.title;
        document.getElementById('sub-title').innerText = data.subtitle;
        document.getElementById('ask-header').innerText = data.askHeader;
        document.getElementById('question-input').placeholder = data.placeholder;

        renderLangButtons(); // ቁልፎቹን እንደገና በማደስ አክቲቭ የሆነውን ማሳየት
    }

    // 4. ጥያቄ ወደ AI/Server የመላክ ተግባር
    async function submitQuestion() {
        const input = document.getElementById('question-input');
        const responseBox = document.getElementById('response-box');
        const question = input.value.trim();

        if (!question) return;

        responseBox.style.display = 'block';
        responseBox.innerText = 'እየፈለገ ነው...';

        try {
            // ከጀርባ ካለው API ጋር ማገናኘት (የእርስዎን API endpoint እዚህ ይተኩ)
            const res = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: question,
                    language: translations[currentLang].name // የተመረጠውን ቋንቋ ይልካል
                })
            });

            const data = await res.json();
            responseBox.innerText = data.reply || "መልስ ማግኘት አልተቻለም።";
        } catch (error) {
            responseBox.innerText = "ስህተት ተፈጥሯል። እባክዎ እንደገና ይሞክሩ።";
        }
    }

    // የመጀመሪያ ገጽ ሲከፈት
    renderLangButtons();
</script>

</body>
</html>
