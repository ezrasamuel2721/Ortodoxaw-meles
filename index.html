<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#006B3C">

<title id="docTitle">ኦርቶዶክሳዊ መልስ</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
    --green:#006B3C;
    --green-dark:#004d2b;
    --gold:#D4AF37;
    --gold-light:#f9f3d9;
    --red:#D21034;
    --blue:#003399;
    --white:#fff;
    --black:#181818;

    --bg:#f7f9fc;
    --card:#fff;
    --text:#1a1a1a;
    --muted:#666;

    --shadow:0 4px 14px rgba(0,0,0,.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:
      "Noto Sans Ethiopic",
      "Segoe UI",
      Tahoma,
      Arial,
      sans-serif;
    transition:background .25s,color .25s;
}

body.dark{
    --bg:#101512;
    --card:#1b211e;
    --text:#eeeeee;
    --muted:#bdbdbd;
    --gold-light:#302c18;
}

body.blue{
    --green:#174ea6;
    --green-dark:#10377a;
    --gold:#e0b52c;
}

body.purple{
    --green:#5b2c83;
    --green-dark:#421f61;
    --gold:#d9b44a;
}

body.soft{
    --bg:#f5f1e8;
    --card:#fffdf7;
}

button,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= NAVBAR ================= */

.navbar{
    position:sticky;
    top:0;
    z-index:100;
    background:
      linear-gradient(135deg,var(--green),var(--blue));
    color:#fff;
    padding:10px 16px;
    border-bottom:4px solid var(--gold);
    box-shadow:var(--shadow);
}

.nav-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-btn{
    width:48px;
    height:44px;
    border:0;
    background:transparent;
    color:var(--gold);
    font-size:28px;
    border-radius:8px;
}

.menu-btn:hover{
    background:rgba(255,255,255,.12);
}

.brand-container{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.logo-box{
    width:50px;
    height:50px;
    border-radius:50%;
    border:2px solid var(--gold);
    background:var(--gold-light);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
}

.logo-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.main-title{
    font-size:21px;
    color:var(--gold);
    text-shadow:1px 1px 3px #0008;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:min(320px,88vw);
    height:100vh;
    background:var(--card);
    z-index:300;

    transform:translateX(-105%);
    transition:transform .25s ease;

    padding:18px;
    overflow-y:auto;

    box-shadow:6px 0 20px #0005;
}

.sidebar.open{
    transform:translateX(0);
}

.sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:2px solid var(--gold);
    padding-bottom:12px;
    margin-bottom:14px;
}

.close-btn{
    border:0;
    background:transparent;
    color:var(--red);
    font-size:26px;
    padding:4px 8px;
}

.sidebar-links{
    list-style:none;
}

.sidebar-links li{
    margin:7px 0;
}

.sidebar-action{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;

    display:flex;
    align-items:center;
    gap:12px;

    padding:13px 11px;
    border-radius:8px;
}

.sidebar-action:hover{
    background:var(--gold-light);
    color:var(--green);
}

.sidebar-action i{
    width:23px;
    text-align:center;
    color:var(--green);
}

.contact-info{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
}

.overlay{
    position:fixed;
    inset:0;
    background:#0008;
    z-index:250;

    opacity:0;
    visibility:hidden;
    transition:.2s;
}

.overlay.open{
    opacity:1;
    visibility:visible;
}

/* ================= LANGUAGE ================= */

.lang-scroll-container{
    background:var(--card);
    border-bottom:2px solid var(--gold);

    overflow-x:auto;
    white-space:nowrap;

    padding:11px 0;
}

.lang-bar{
    display:inline-flex;
    gap:9px;
    padding:0 15px;
}

.lang-btn{
    border:1.5px solid var(--gold);
    background:transparent;
    color:var(--text);

    padding:7px 15px;
    border-radius:22px;

    font-weight:700;
}

.lang-btn:hover,
.lang-btn.active{
    background:var(--gold);
    color:#111;
}

/* ================= MAIN ================= */

.main-container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:0 15px 20px;
}

.quote-section{
    text-align:center;

    margin:20px 0;
    padding:15px;

    border-left:5px solid var(--red);
    border-right:5px solid var(--green);

    background:var(--card);
    border-radius:9px;

    box-shadow:var(--shadow);
}

.quote-text{
    color:var(--green);
    font-size:22px;
    margin-bottom:7px;
}

.sub-quote-text{
    color:var(--red);
    font-size:15px;
}

/* ================= QUESTION ================= */

.input-card{
    background:var(--card);
    padding:20px;

    border-radius:12px;
    border-top:4px solid var(--gold);

    box-shadow:var(--shadow);
}

.input-label{
    display:block;
    color:var(--green);
    font-size:18px;
    font-weight:800;
    margin-bottom:9px;
}

textarea{
    width:100%;
    min-height:110px;

    padding:13px;

    border:1px solid #c9c9c9;
    border-radius:7px;

    resize:vertical;

    font-size:16px;

    background:var(--bg);
    color:var(--text);

    outline:none;
}

textarea:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px #006b3c22;
}

.ask-btn{
    width:100%;
    margin-top:12px;

    border:0;
    border-radius:7px;

    background:var(--green);
    color:#fff;

    padding:13px;

    font-size:16px;
    font-weight:800;
}

.ask-btn:hover{
    background:var(--green-dark);
}

.ask-btn:disabled{
    opacity:.65;
    cursor:wait;
}

/* ================= ANSWER ================= */

.answer-section{
    margin-top:25px;
}

.hidden{
    display:none!important;
}

.answer-card{
    background:var(--card);

    border:2px solid var(--gold);
    border-radius:11px;

    padding:20px;

    box-shadow:var(--shadow);

    margin-bottom:15px;

    /* IMPORTANT:
       No fixed height
       No max-height
       No overflow scroll
    */
    height:auto;
    max-height:none;
    overflow:visible;
}

.answer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
    flex-wrap:wrap;

    border-bottom:1px solid #ccc;

    padding-bottom:12px;
    margin-bottom:16px;
}

.answer-header h4{
    color:var(--green);
    font-size:18px;
}

.answer-tools{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.tool-btn{
    border:1px solid var(--gold);
