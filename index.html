<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኦርቶዶክሳዊ መልስ</title>

    <!-- FontAwesome icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #AA7C11;
            --deep-red: #800000;
            --royal-blue: #002366;
            --bg-light: #FDFBF7;
            --text-dark: #2C2C2C;
            --white: #FFFFFF;
            --green: #2e7d32;
            --card-bg: #FFFFFF;
            --input-border: #DDD;
            --answer-bg: #F4F6F9;
        }

        body.dark-mode {
            --bg-light: #121212;
            --text-dark: #E0E0E0;
            --card-bg: #1E1E1E;
            --input-border: #444;
            --answer-bg: #2A2A2A;
            --royal-blue: #64B5F6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Nyala, 'Abyssinica SIL', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background: linear-gradient(135deg, var(--deep-red), #002366);
            color: var(--gold);
            padding: 0.6rem 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 4px solid var(--gold);
            position: relative;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .main-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        /* ================================
           የተስተካከለው የኦርቶዶክሳዊ መልስ ሎጎ
           ================================ */
        .brand-logo {
            width: 58px;
            height: 58px;
            min-width: 58px;
            min-height: 58px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            object-position: center;
            background-color: #FFFFFF;
            flex-shrink: 0;
            display: block;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .menu-btn:hover {
            transform: scale(1.1);
        }

            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background-color: #1A1A1
